<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-108" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <radialGradient id="glow-108" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </radialGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="750" fill="url(#bg-108)" />
  <rect width="500" height="750" fill="url(#glow-108)" />

  <!-- Border Accent -->
  <rect x="15" y="15" width="470" height="720" fill="none" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2" rx="16" />

  <!-- Platform / Category Badge -->
  <g transform="translate(30, 45)">
    <rect width="440" height="36" rx="18" fill="rgba(0, 0, 0, 0.6)" stroke="rgba(255, 255, 255, 0.2)" />
    <text x="220" y="23" fill="#facc15" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="1.5" text-anchor="middle">
      ✓ 2-WAY VERIFIED • KANNADA ORIGINAL • DOCUMENTARY
    </text>
  </g>

  <!-- Decorative Cinema Emblem -->
  <g transform="translate(250, 260)" text-anchor="middle">
    <circle r="70" fill="rgba(0, 0, 0, 0.4)" stroke="rgba(250, 204, 21, 0.5)" stroke-width="2" />
    <polygon points="-20,-30 35,0 -20,30" fill="#facc15" opacity="0.9" />
  </g>

  <!-- Movie Title and Subtitle -->
  <g transform="translate(250, 520)" text-anchor="middle">
    <text y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="1">
      GANDHADA GUDI
    </text>
    <text y="40" fill="rgba(255, 255, 255, 0.85)" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">
      Dr. Puneeth Rajkumar • Amoghavarsha
    </text>
  </g>

  <!-- Quality & Verified Direct Stream Tag -->
  <g transform="translate(30, 650)">
    <rect width="440" height="48" rx="8" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5" />
    <text x="220" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.5" text-anchor="middle">
      ✓ 100% DIRECT STREAM LINK VERIFIED
    </text>
  </g>
</svg>